<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monstermon - Adventure</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="hud">
      <div>
        <strong>Monstermon</strong>
        <div id="statusLine">Esplora, lotta e completa il dex.</div>
      </div>
      <div id="quickInfo"></div>
    </div>

    <div id="wrap">
      <canvas id="game" width="960" height="640" aria-label="Gioco monster-catching"></canvas>
      <aside id="panel">
        <h2>Squadra</h2>
        <div id="teamList"></div>
        <h2>Inventario</h2>
        <div id="bagList"></div>
        <h2>Dex</h2>
        <div id="dexList"></div>
        <h2>Legenda</h2>
        <ul>
          <li>E = interagisci</li>
          <li>I = mostra/nascondi pannello</li>
          <li>Shift = corsa</li>
        </ul>
      </aside>
    </div>

    <script src="main.js"></script>
  </body>
</html>
